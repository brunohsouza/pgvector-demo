<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pgvector demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1B2433; --navy-2: #2A3648; --cream: #F5F3EE; --paper: #FBFAF7;
    --line: #DDD8CE; --ink: #1B2433; --muted: #5F6673; --blue: #2F5D8A;
    --orange: #D9822B; --orange-soft: #F6E3CF; --red: #B4412F;
    --sans: 'IBM Plex Sans', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink); font: 17px/1.45 var(--sans); }
  button, input, select, textarea { font: inherit; color: inherit; }

  header { background: var(--navy); color: var(--cream); padding: 18px 32px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; font-weight: 600; }
  header h1 span { color: #E9963F; font-family: var(--mono); font-weight: 400; margin-right: 10px; }
  .spacer { flex: 1; }
  .chip { font-family: var(--mono); font-size: 14px; background: var(--navy-2); border-radius: 999px; padding: 6px 14px; color: #C9D3DF; }
  .chip b { color: var(--cream); font-weight: 600; }

  main { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(320px, 1fr); gap: 24px; padding: 24px 32px 40px; max-width: 1560px; margin: 0 auto; }
  .col { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; }
  .card h2 { margin: 0 0 14px; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--blue); font-family: var(--mono); font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .card h2 .count { color: var(--muted); font-weight: 400; }
  .card h2 .spacer { flex: 1; }

  .search { display: flex; gap: 10px; flex-wrap: wrap; }
  .search input { flex: 1 1 320px; }
  input, select, textarea { background: #fff; border: 1px solid #CFC9BD; border-radius: 10px; padding: 11px 14px; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(47, 93, 138, .15); }
  textarea { width: 100%; resize: vertical; min-height: 76px; }

  .btn { border: 0; border-radius: 10px; padding: 11px 18px; cursor: pointer; font-weight: 500; background: var(--navy); color: var(--cream); }
  .btn:hover { background: var(--navy-2); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid #CFC9BD; }
  .btn.ghost:hover { background: #fff; }
  .btn.light { background: var(--navy-2); color: var(--cream); }
  .btn.small { padding: 6px 12px; font-size: 14px; }
  .btn.danger { color: var(--red); border-color: #E3B9B0; }
  .btn.danger.armed { background: var(--red); color: #fff; border-color: var(--red); }
  .btn:disabled { opacity: .55; cursor: progress; }

  .results { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .result { display: grid; grid-template-columns: 34px minmax(0, 1fr) 150px; gap: 14px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .rank { font-family: var(--mono); font-weight: 600; color: var(--orange); font-size: 20px; }
  .title { font-weight: 600; }
  .body { color: var(--muted); font-size: 15px; }
  .score { font-family: var(--mono); font-size: 15px; text-align: right; }
  .bar { height: 8px; background: #EEE9DF; border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--orange); border-radius: 4px; transition: width .5s ease; }
  .empty { color: var(--muted); margin: 14px 0 0; }

  .pill { display: inline-block; font-family: var(--mono); font-size: 12px; padding: 2px 9px; border-radius: 999px; background: #E9EEF3; color: var(--blue); margin-left: 8px; vertical-align: 2px; }
  .pill.tax { background: var(--orange-soft); color: #A85A14; }
  .pill.pets { background: #E3EFE6; color: #3C6E4A; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 500; padding: 0 10px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 12px 10px; border-bottom: 1px solid #ECE7DD; vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.id { font-family: var(--mono); color: var(--muted); width: 48px; }
  td.actions { white-space: nowrap; text-align: right; width: 1%; }
  td.actions .btn + .btn { margin-left: 6px; }
  tr.flash td { animation: flash 1.6s ease; }
  @keyframes flash { from { background: var(--orange-soft); } to { background: transparent; } }

  form.edit { display: none; gap: 12px; grid-template-columns: 1fr 180px; background: #fff; border: 1px dashed #CFC9BD; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  form.edit.open { display: grid; }
  form.edit label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  form.edit input, form.edit textarea { font-size: 17px; color: var(--ink); }
  form.edit .full { grid-column: 1 / -1; }
  form.edit .row { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; }
  form.edit .row .hint { color: var(--muted); font-size: 14px; }

  .sql { position: sticky; top: 24px; background: var(--navy); color: var(--cream); border: 0; }
  .sql h2 { color: #E9963F; }
  .sql .action { font-size: 15px; color: #C9D3DF; margin: -6px 0 12px; }
  .sql pre { margin: 0; font: 14px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word; background: var(--navy-2); border-radius: 10px; padding: 16px; min-height: 120px; }
  .sql .kw { color: #E9963F; }
  .sql .param { color: #9CC3E6; }
  .sql .timing { margin-top: 12px; font-family: var(--mono); font-size: 13px; color: #A9B4C2; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--red); color: #fff; padding: 12px 18px; border-radius: 10px; display: none; }
  .toast.show { display: block; }

  @media (max-width: 960px) {
    main { grid-template-columns: 1fr; padding: 16px; }
    header { padding: 16px; }
    .sql { position: static; }
    .result { grid-template-columns: 28px minmax(0, 1fr); }
    .result .scorebox { grid-column: 2; }
    form.edit { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    th:first-child, td.id { display: none; }
    td.actions { white-space: normal; }
    td.actions .btn { display: block; width: 100%; }
    td.actions .btn + .btn { margin: 6px 0 0; }
  }
</style>
</head>
<body>
<header>
  <h1><span>SELECT</span>pgvector demo</h1>
  <div class="chip" id="info">loading…</div>
  <div class="spacer"></div>
  <button class="btn light" id="reset">Reset sample data</button>
</header>

<main>
  <div class="col">
    <section class="card">
      <h2>Search by meaning</h2>
      <form class="search" id="search-form">
        <input id="q" placeholder="Ask a question…" value="the tax due when you sell shares at a profit" autocomplete="off">
        <select id="topic" aria-label="Topic filter"><option value="">All topics</option></select>
        <button class="btn" id="search-btn">Search</button>
      </form>
      <ol class="results" id="results"></ol>
      <p class="empty" id="results-empty">Run a search to see the three nearest documents.</p>
    </section>

    <section class="card">
      <h2>Documents <span class="count" id="count"></span><span class="spacer"></span>
        <button class="btn ghost small" id="add">+ Add document</button></h2>
      <form class="edit" id="edit-form">
        <label>Title<input name="title" required></label>
        <label>Topic<input name="topic" list="topics" required></label>
        <label class="full">Text (this is what gets embedded)<textarea name="body" required></textarea></label>
        <div class="row">
          <button class="btn" id="save">Save</button>
          <button class="btn ghost" type="button" id="cancel">Cancel</button>
          <span class="hint" id="form-hint"></span>
        </div>
        <datalist id="topics"></datalist>
      </form>
      <table>
        <thead><tr><th>ID</th><th>Document</th><th>Topic</th><th></th></tr></thead>
        <tbody id="docs"></tbody>
      </table>
    </section>
  </div>

  <aside class="col">
    <section class="card sql">
      <h2>SQL that just ran</h2>
      <p class="action" id="sql-action">Nothing yet.</p>
      <pre id="sql"></pre>
      <div class="timing" id="timing"></div>
    </section>
  </aside>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
let docs = []
let editingId = null
let lastSearch = null // re-run after every change so the effect shows at once

async function api(path, options = {}) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options })
  const data = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`)
  return data
}

function toast(message) {
  $('toast').textContent = message
  $('toast').classList.add('show')
  setTimeout(() => $('toast').classList.remove('show'), 3500)
}

function showSql(action, sql, timing = '') {
  $('sql-action').textContent = action
  $('sql').innerHTML = esc(sql)
    .replace(/\b(SELECT|FROM|WHERE|ORDER BY|LIMIT|INSERT INTO|VALUES|RETURNING|UPDATE|SET LOCAL|SET|DELETE FROM|CREATE TABLE|CREATE INDEX ON|USING|AS|NOT NULL|PRIMARY KEY|DEFAULT)\b/g, '<span class="kw">$1</span>')
    .replace(/(\$\d|&lt;=&gt;)/g, '<span class="param">$1</span>')
  $('timing').textContent = timing
}

async function busy(button, fn) {
  button.disabled = true
  try { await fn() } catch (err) { toast(err.message) } finally { button.disabled = false }
}

function renderTopics() {
  const topics = [...new Set(docs.map((d) => d.topic))].sort()
  const current = $('topic').value
  $('topic').innerHTML = '<option value="">All topics</option>' +
    topics.map((t) => `<option value="${esc(t)}">Only “${esc(t)}”</option>`).join('')
  $('topic').value = topics.includes(current) ? current : ''
  $('topics').innerHTML = topics.map((t) => `<option value="${esc(t)}">`).join('')
}

function renderDocs(flashId) {
  $('count').textContent = `(${docs.length})`
  $('docs').innerHTML = docs.map((d) => `
    <tr data-id="${d.id}" class="${d.id === flashId ? 'flash' : ''}">
      <td class="id">${d.id}</td>
      <td><div class="title">${esc(d.title)}</div><div class="body">${esc(d.body)}</div></td>
      <td><span class="pill ${esc(d.topic)}">${esc(d.topic)}</span></td>
      <td class="actions">
        <button class="btn ghost small" data-edit="${d.id}">Edit</button>
        <button class="btn ghost small danger" data-delete="${d.id}">Delete</button>
      </td>
    </tr>`).join('')
  renderTopics()
}

async function loadDocs(flashId) {
  const data = await api('/api/documents')
  docs = data.rows
  renderDocs(flashId)
  return data
}

function renderResults(rows) {
  $('results-empty').style.display = rows.length ? 'none' : 'block'
  $('results-empty').textContent = rows.length ? '' : 'No documents match.'
  $('results').innerHTML = rows.map((r, i) => `
    <li class="result">
      <div class="rank">${i + 1}</div>
      <div><span class="title">${esc(r.title)}</span><span class="pill ${esc(r.topic)}">${esc(r.topic)}</span>
        <div class="body">${esc(r.body)}</div></div>
      <div class="scorebox"><div class="score">${r.similarity.toFixed(3)}</div>
        <div class="bar"><i style="width:0%" data-w="${Math.max(0, r.similarity) * 100}"></i></div></div>
    </li>`).join('')
  requestAnimationFrame(() => document.querySelectorAll('.bar i').forEach((b) => { b.style.width = b.dataset.w + '%' }))
}

async function runSearch({ silent = false } = {}) {
  const q = silent ? lastSearch?.q : $('q').value.trim()
  if (!q) return silent ? undefined : toast('Type a question first.')
  const topic = silent ? lastSearch.topic : $('topic').value
  lastSearch = { q, topic }
  const params = new URLSearchParams({ q, ...(topic && { topic }) })
  const data = await api(`/api/search?${params}`)
  renderResults(data.rows)
  if (silent) return
  showSql(topic ? `Nearest 3 in “${topic}”, with iterative scans` : 'Nearest 3 documents',
    data.sql, `embed ${data.embedMs} ms · query ${data.queryMs} ms`)
}

function openForm(doc) {
  editingId = doc?.id ?? null
  const f = $('edit-form')
  f.title.value = doc?.title ?? ''
  f.topic.value = doc?.topic ?? ''
  f.body.value = doc?.body ?? ''
  $('save').textContent = editingId ? `Save #${editingId}` : 'Add'
  $('form-hint').textContent = editingId ? 'New text gets a new vector in the same UPDATE.' : 'The text is embedded, then inserted with its vector.'
  f.classList.add('open')
  f.title.focus()
}

function closeForm() {
  editingId = null
  $('edit-form').classList.remove('open')
}

$('search-form').addEventListener('submit', (e) => { e.preventDefault(); busy($('search-btn'), runSearch) })
$('topic').addEventListener('change', () => { if ($('q').value.trim()) busy($('search-btn'), runSearch) })
$('add').addEventListener('click', () => openForm())
$('cancel').addEventListener('click', closeForm)

$('edit-form').addEventListener('submit', (e) => {
  e.preventDefault()
  busy($('save'), async () => {
    const f = e.target
    const doc = { title: f.title.value, topic: f.topic.value, body: f.body.value }
    const t0 = performance.now()
    if (editingId) {
      const data = await api(`/api/documents/${editingId}`, { method: 'PUT', body: JSON.stringify(doc) })
      showSql(`Updated document #${editingId}`, data.sql, `${Math.round(performance.now() - t0)} ms, including the embedding call`)
      await loadDocs(editingId)
      await runSearch({ silent: true })
    } else {
      const data = await api('/api/documents', { method: 'POST', body: JSON.stringify(doc) })
      showSql(`Inserted document #${data.id}`, data.sql, `${Math.round(performance.now() - t0)} ms, including the embedding call`)
      await loadDocs(data.id)
      await runSearch({ silent: true })
    }
    closeForm()
  })
})

$('docs').addEventListener('click', (e) => {
  const edit = e.target.closest('[data-edit]')
  const del = e.target.closest('[data-delete]')
  if (edit) openForm(docs.find((d) => d.id === Number(edit.dataset.edit)))
  if (!del) return
  if (!del.classList.contains('armed')) {
    del.classList.add('armed')
    del.textContent = 'Confirm'
    setTimeout(() => { del.classList.remove('armed'); del.textContent = 'Delete' }, 3000)
    return
  }
  busy(del, async () => {
    const id = Number(del.dataset.delete)
    const data = await api(`/api/documents/${id}`, { method: 'DELETE' })
    showSql(`Deleted document #${id}`, data.sql)
    if (editingId === id) closeForm()
    await loadDocs()
    await runSearch({ silent: true })
  })
})

$('reset').addEventListener('click', () => busy($('reset'), async () => {
  const data = await api('/api/reset', { method: 'POST' })
  showSql('Recreated the table and inserted the sample documents', data.sql)
  closeForm()
  lastSearch = null
  renderResults([])
  $('results-empty').textContent = 'Run a search to see the three nearest documents.'
  await loadDocs()
}))

api('/api/info').then((i) => {
  $('info').innerHTML = `<b>${esc(i.provider)}</b> · ${esc(i.model)} · <b>vector(${i.dimensions})</b>`
}).catch((err) => toast(err.message))
loadDocs().then((data) => showSql('Loaded all documents', data.sql)).catch((err) => toast(err.message))
</script>
</body>
</html>
