<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Each action embeds the text, then runs one SQL statement. The web page sends a request to the Express API. The API sends text to the embedding API and gets a vector back, then sends SQL with the vector to Postgres with pgvector, which returns rows. The API returns the rows and the SQL to the page.">
  <style>
    .bg { fill: #FBFAF7; stroke: #B8B2A6; stroke-width: 1; }
    .box { fill: #FBFAF7; stroke: #B8B2A6; stroke-width: 1.5; }
    .box.db { fill: #F6E3CF; stroke: #D9822B; stroke-width: 2.5; }
    .name { font: 600 17px system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1B2433; }
    .line { font: 400 14px system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #5F6673; }
    .db-line { fill: #1B2433; }
    .edge { stroke: #8F887B; stroke-width: 1.5; fill: none; }
    .edge-label { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5F6673; }
    .arrowhead { fill: #8F887B; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="899" height="379" rx="16"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>

  <!-- connectors -->
  <path class="edge" d="M232 112H330" marker-end="url(#arrow)"/>
  <path class="edge" d="M330 140H232" marker-end="url(#arrow)"/>
  <path class="edge" d="M570 112H668" marker-end="url(#arrow)"/>
  <path class="edge" d="M668 140H570" marker-end="url(#arrow)"/>
  <path class="edge" d="M428 186V246" marker-end="url(#arrow)"/>
  <path class="edge" d="M472 246V186" marker-end="url(#arrow)"/>

  <text class="edge-label" x="281" y="100" text-anchor="middle">request</text>
  <text class="edge-label" x="281" y="164" text-anchor="middle">rows + SQL</text>
  <text class="edge-label" x="619" y="100" text-anchor="middle">SQL with $1</text>
  <text class="edge-label" x="619" y="164" text-anchor="middle">rows</text>
  <text class="edge-label" x="418" y="221" text-anchor="end">text</text>
  <text class="edge-label" x="482" y="221">vector</text>

  <!-- Web page -->
  <rect class="box" x="16" y="66" width="216" height="120" rx="12"/>
  <text class="name" x="36" y="100">Web page</text>
  <text class="line" x="36" y="128">search, add, edit and</text>
  <text class="line" x="36" y="148">delete documents;</text>
  <text class="line" x="36" y="168">shows the SQL that ran</text>

  <!-- Express API -->
  <rect class="box" x="330" y="66" width="240" height="120" rx="12"/>
  <text class="name" x="350" y="100">Express API</text>
  <text class="line" x="350" y="128">server.js: one route</text>
  <text class="line" x="350" y="148">per operation; embeds,</text>
  <text class="line" x="350" y="168">then runs the SQL</text>

  <!-- Postgres + pgvector -->
  <rect class="box db" x="668" y="66" width="216" height="120" rx="12"/>
  <text class="name" x="688" y="100">Postgres + pgvector</text>
  <text class="line db-line" x="688" y="128">documents table:</text>
  <text class="line db-line" x="688" y="148">text + vector column,</text>
  <text class="line db-line" x="688" y="168">HNSW index, cosine</text>

  <!-- Embedding API -->
  <rect class="box" x="330" y="246" width="240" height="120" rx="12"/>
  <text class="name" x="350" y="280">Embedding API</text>
  <text class="line" x="350" y="308">OpenAI, Gemini or</text>
  <text class="line" x="350" y="328">Voyage: text in,</text>
  <text class="line" x="350" y="348">a vector out</text>
</svg>
